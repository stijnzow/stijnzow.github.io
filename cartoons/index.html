<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comics of the day</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../huisstijl/colors.css" />
    <link rel="stylesheet" href="style_new.css">
</head>

<body>
    <header>
        <h1>Cartoons of <span id="datesig">today</span></h1>
        <div>
            <button id="btn-first" title="[a] go to oldest" onclick="changePubdateTo('first')"><i
                    class="fa-solid fa-backward-fast"></i></button>
            <button id="btn-prev" title="[p] go to previous" onclick="changePubdateTo('prev')"><i
                    class="fa-solid fa-backward-step"></i></button>
            <button id="btn-random" title="[r] go to random" onclick="changePubdateTo('random')"><i
                    class="fa-solid fa-shuffle"></i></button>
            <button id="btn-next" title="[n] go to next" onclick="changePubdateTo('next')"><i
                    class="fa-solid fa-forward-step"></i></button>
            <button id="btn-last" title="[z] go to newest" onclick="changePubdateTo('last')"><i
                    class="fa-solid fa-forward-fast"></i></button>
        </div>
    </header>
    <main>
        <div class="column left">
            <section id="garfield" class="card">
                <div class="card-header">
                    <h2>Garfield</h2>
                </div>
                <div class="card-body">
                    <img src="" alt="" />
                </div>
            </section>
            <section id="wizardofid" class="card">
                <div class="card-header">
                    <h2>Wizard of ID</h2>
                </div>
                <div class="card-body">
                    <img src="" alt="" />
                </div>
            </section>
            <section id="andycapp" class="card">
                <div class="card-header">
                    <h2>Andy Capp</h2>
                </div>
                <div class="card-body">
                    <img src="" alt="" />
                </div>
            </section>
        </div>
        <div class="column right">
            <section id="glasbergen-cartoons" class="card">
                <div class="card-header">
                    <h2>Glasbergen</h2>
                </div>
                <div class="card-body">
                    <img src="" alt="" />
                </div>
            </section>
            <section id="offthemark" class="card">
                <div class="card-header">
                    <h2>Off the mark</h2>
                </div>
                <div class="card-body">
                    <img src="" alt="" />
                </div>
            </section>
        </div>
    </main>

    <script src="script_new.js"></script>
</body>

</html>
